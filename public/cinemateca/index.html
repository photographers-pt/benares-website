<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinemateca | Club Benares</title>
  <meta name="description" content="As curtas-metragens do Club Benares, para ver: Inexistente, El Artista Comprendido, El Profesor, Jay Gupta e Firefly." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Club Benares" />
  <meta property="og:locale" content="pt_PT" />
  <meta property="og:title" content="Cinemateca | Club Benares" />
  <meta property="og:description" content="As curtas-metragens do Club Benares, para ver: Inexistente, El Artista Comprendido, El Profesor, Jay Gupta e Firefly." />
  <meta property="og:image" content="https://thebenaresclub.com/media/fototeca/full/nl1-05.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: #000000; }
    main { padding: 0 0 8rem; }

    /* ════════════════════════════════
       VIDEO HERO
    ════════════════════════════════ */
    .video-hero {
      position: relative;
      width: 100%;
      height: 88vh;
      min-height: 520px;
      max-height: 860px;
      overflow: hidden;
      background: #000000;
    }

    /* Video slides */
    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }
    .hero-slide.active {
      opacity: 1;
      pointer-events: all;
    }

    .hero-video {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .hero-poster-bg {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 8rem;
      background: linear-gradient(135deg, #0f0f0f 0%, #161616 50%, #0a0a0a 100%);
    }

    /* Gradient overlays */
    .video-hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.45) 55%, rgba(0,0,0,0.05) 100%),
        linear-gradient(to top, rgba(0,0,0,0.95) 0%, transparent 40%);
      z-index: 2;
      pointer-events: none;
    }

    /* Hero content */
    .hero-content {
      position: absolute;
      bottom: clamp(3rem, 8vh, 6rem);
      left: clamp(1.5rem, 5vw, 5rem);
      z-index: 3;
      max-width: 580px;
    }

    .hero-eyebrow {
      font-family: var(--font-family);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 0.7rem;
      display: block;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2.8rem, 6vw, 5.5rem);
      font-weight: 400;
      color: var(--text-primary);
      line-height: 1.0;
      margin: 0 0 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .hero-meta {
      font-family: var(--font-family);
      font-size: 0.8rem;
      color: rgba(255,255,255,0.5);
      margin-bottom: 1rem;
      letter-spacing: 0.06em;
    }

    .hero-description {
      font-family: var(--font-family);
      font-size: 0.95rem;
      line-height: 1.72;
      color: rgba(255,255,255,0.7);
      margin-bottom: 2rem;
      max-width: 440px;
    }

    .hero-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn-rent {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--font-family);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0a0a0a;
      background: rgba(255,255,255,0.96);
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.8rem 1.75rem;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-rent:hover { background: #fff; transform: translateY(-1px); }

    .btn-info {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--font-family);
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-primary);
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: var(--radius-sm);
      padding: 0.8rem 1.5rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-info:hover { background: rgba(255,255,255,0.17); }

    /* Hero nav: dots + arrows */
    .hero-nav {
      position: absolute;
      bottom: clamp(1.5rem, 4vh, 3rem);
      right: clamp(1.5rem, 4vw, 4rem);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }

    .hero-dots {
      display: flex;
      gap: 0.45rem;
    }

    .hero-dot {
      width: 28px; height: 2px;
      background: rgba(255,255,255,0.25);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.3s, width 0.3s;
      border-radius: 2px;
    }
    .hero-dot.active {
      background: rgba(255,255,255,0.85);
      width: 44px;
    }

    .hero-arrow {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 50%;
      width: 2.25rem; height: 2.25rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: rgba(255,255,255,0.7);
      transition: background 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .hero-arrow:hover { background: rgba(255,255,255,0.15); color: var(--text-primary); }

    /* Progress bar */
    .hero-progress {
      position: absolute;
      bottom: 0; left: 0;
      height: 2px;
      background: rgba(255,255,255,0.18);
      width: 100%;
      z-index: 3;
    }
    .hero-progress-bar {
      height: 100%;
      background: rgba(255,255,255,0.55);
      width: 0%;
      transition: width linear;
    }

    /* ════════════════════════════════
       CATALOG ROW (Netflix-style)
    ════════════════════════════════ */
    .catalog-row {
      padding: 3rem 0 0;
    }

    .row-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      padding: 0 clamp(1.25rem, 4vw, 3.5rem);
      margin-bottom: 1.25rem;
    }

    .row-eyebrow {
      font-family: var(--font-family);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .row-title {
      font-family: var(--font-family);
      font-size: clamp(1.25rem, 2.5vw, 1.6rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
      margin: 0;
    }

    .row-count {
      font-family: var(--font-family);
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-left: auto;
    }

    /* Scroll container */
    .row-scroll-wrap {
      position: relative;
    }

    .row-scroll {
      display: flex;
      gap: 0.85rem;
      overflow-x: auto;
      padding: 0.5rem clamp(1.25rem, 4vw, 3.5rem) 1.5rem;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .row-scroll::-webkit-scrollbar { display: none; }

    /* Scroll fade edges */
    .row-scroll-wrap::before,
    .row-scroll-wrap::after {
      content: '';
      position: absolute;
      top: 0; bottom: 1.5rem;
      width: clamp(1.25rem, 4vw, 3.5rem);
      z-index: 2;
      pointer-events: none;
    }
    .row-scroll-wrap::before {
      left: 0;
      background: linear-gradient(to right, #000000, transparent);
    }
    .row-scroll-wrap::after {
      right: 0;
      background: linear-gradient(to left, #000000, transparent);
    }

    /* Scroll arrows */
    .scroll-btn {
      position: absolute;
      top: 50%;
      transform: translateY(calc(-50% - 0.75rem));
      z-index: 3;
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
      width: 2.5rem; height: 2.5rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: rgba(255,255,255,0.7);
      transition: background 0.2s, color 0.2s, opacity 0.2s;
      opacity: 0;
    }
    .row-scroll-wrap:hover .scroll-btn { opacity: 1; }
    .scroll-btn:hover { background: rgba(20,20,20,0.95); color: var(--text-primary); }
    .scroll-btn.left { left: 0.5rem; }
    .scroll-btn.right { right: 0.5rem; }
    .scroll-btn:disabled { opacity: 0 !important; pointer-events: none; }

    /* ── Film card ── */
    .film-card {
      flex-shrink: 0;
      width: clamp(140px, 18vw, 220px);
      scroll-snap-align: start;
      cursor: pointer;
      border-radius: var(--radius-md);
      overflow: visible;
      position: relative;
    }

    .film-card-inner {
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,0.06);
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      transform-origin: center bottom;
    }

    .film-card:hover .film-card-inner {
      transform: scale(1.08) translateY(-4px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.65);
      border-color: rgba(255,255,255,0.18);
      z-index: 10;
    }

    .film-poster-wrap {
      position: relative;
      aspect-ratio: 2/3;
      overflow: hidden;
    }

    .film-poster-img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform 0.4s ease;
    }
    .film-card:hover .film-poster-img { transform: scale(1.04); }

    .film-poster-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem;
      background: linear-gradient(160deg, #181818 0%, #0c0c0c 100%);
      transition: transform 0.4s ease;
    }
    .film-card:hover .film-poster-placeholder { transform: scale(1.04); }

    /* Price badge */
    .price-badge {
      display: inline-block;
      margin-top: 0.35rem;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 99px;
      padding: 0.18rem 0.55rem;
      font-family: var(--font-family);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.8);
    }
    .price-badge.free    { color: rgba(80,200,130,0.95); border-color: rgba(80,200,130,0.3); }
    .price-badge.soon    { color: rgba(255,255,255,0.35); border-color: rgba(255,255,255,0.08); }

    /* Watch button (free films in modal) */
    .watch-now-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.55rem;
      width: 100%;
      font-family: var(--font-family);
      font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: #0a0a0a;
      background: rgba(255,255,255,0.95);
      border: none; border-radius: var(--radius-sm);
      padding: 1rem; text-align: center;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 0.75rem;
    }
    .watch-now-btn:hover { background: #fff; }
    .watch-now-btn.soon {
      opacity: 0.38; cursor: default;
      background: rgba(255,255,255,0.08);
      color: var(--text-secondary);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .watch-now-btn.soon:hover { background: rgba(255,255,255,0.08); }

    /* Coming-soon card dim */
    .film-card.coming-soon .film-card-inner { opacity: 0.65; }
    .film-card.coming-soon:hover .film-card-inner { opacity: 0.85; }

    /* Hover info panel */
    .film-hover-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.96) 0%, rgba(0,0,0,0.7) 60%, transparent 100%);
      padding: 2rem 1rem 1rem;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .film-card:hover .film-hover-panel { opacity: 1; }

    .hover-rent-btn {
      display: block;
      width: 100%;
      font-family: var(--font-family);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0a0a0a;
      background: rgba(255,255,255,0.95);
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.55rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
      box-sizing: border-box;
    }
    .hover-rent-btn:hover { background: #fff; }

    /* Card info below poster */
    .film-card-info {
      padding: 0.85rem 0.85rem 1rem;
    }

    .film-card-title {
      font-family: var(--font-family);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      margin: 0 0 0.25rem;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .film-card-meta {
      font-family: var(--font-family);
      font-size: 0.68rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* ════════════════════════════════
       HOW IT WORKS
    ════════════════════════════════ */
    .how-section {
      padding: 4rem clamp(1.25rem, 4vw, 3.5rem) 0;
    }

    .section-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 4rem 0 0;
    }

    .steps-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-top: 2rem;
    }
    @media (max-width: 640px) {
      .steps-row { grid-template-columns: 1fr; gap: 1rem; }
    }

    .step-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius-md);
      padding: 1.75rem;
    }

    .step-num {
      font-family: var(--font-family);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      display: block;
    }

    .step-title {
      font-family: var(--font-family);
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
      margin: 0 0 0.5rem;
    }

    .step-desc {
      font-family: var(--font-family);
      font-size: 0.85rem;
      line-height: 1.65;
      color: var(--text-secondary);
      margin: 0;
    }

    /* ════════════════════════════════
       MODAL
    ════════════════════════════════ */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: all; }

    .modal {
      background: #111111;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg);
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr;
      position: relative;
      transform: translateY(14px) scale(0.98);
      transition: transform 0.28s ease;
    }
    .modal-backdrop.open .modal { transform: translateY(0) scale(1); }

    .modal-poster {
      aspect-ratio: 16/9;
      width: 100%;
      object-fit: cover;
      display: block;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .modal-poster-placeholder {
      display: flex; align-items: center; justify-content: center;
      font-size: 5rem;
      background: linear-gradient(160deg, #141414 0%, #0a0a0a 100%);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      aspect-ratio: 16/9;
    }

    .modal-body { padding: 2.25rem 2rem; display: flex; flex-direction: column; }

    .modal-eyebrow {
      font-family: var(--font-family);
      font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--text-muted); margin-bottom: 0.6rem;
    }

    .modal-title {
      font-family: var(--font-serif);
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 400; color: var(--text-primary);
      margin: 0 0 0.5rem; text-transform: uppercase;
      letter-spacing: 0.04em; line-height: 1.1;
    }

    .modal-meta {
      font-family: var(--font-family);
      font-size: 0.78rem; color: var(--text-muted);
      margin-bottom: 1.25rem; letter-spacing: 0.04em;
    }

    .modal-description {
      font-family: var(--font-family);
      font-size: 0.92rem; line-height: 1.75;
      color: var(--text-secondary); margin-bottom: 1.75rem; flex: 1;
    }

    /* Purchase options */
    .purchase-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .purchase-option {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: var(--radius-sm);
      padding: 1rem 1rem 0.85rem;
      transition: border-color 0.2s;
    }
    .purchase-option:hover { border-color: rgba(255,255,255,0.2); }

    .purchase-option-label {
      font-family: var(--font-family);
      font-size: 0.62rem; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--text-muted);
    }

    .purchase-option-detail {
      font-family: var(--font-family);
      font-size: 0.72rem;
      color: rgba(255,255,255,0.35);
      margin-bottom: 0.2rem;
    }

    .purchase-option-price {
      font-family: var(--font-family);
      font-size: 1.35rem; font-weight: 300;
      color: var(--text-primary);
      margin-bottom: 0.6rem;
    }

    .purchase-option-btn {
      display: block; width: 100%;
      font-family: var(--font-family);
      font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      border: none; border-radius: var(--radius-sm);
      padding: 0.65rem; text-decoration: none;
      cursor: pointer; text-align: center;
      transition: background 0.2s, border-color 0.2s;
      box-sizing: border-box;
    }

    .purchase-option-btn.primary {
      color: #0a0a0a;
      background: rgba(255,255,255,0.95);
    }
    .purchase-option-btn.primary:hover { background: #fff; }

    .purchase-option-btn.secondary {
      color: var(--text-primary);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .purchase-option-btn.secondary:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.35);
    }

    .modal-note {
      font-family: var(--font-family);
      font-size: 0.72rem; color: var(--text-muted);
      text-align: center; line-height: 1.5;
    }

    .modal-close {
      position: absolute; top: 1rem; right: 1rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%; width: 2rem; height: 2rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      font-size: 1rem; line-height: 1;
      transition: background 0.2s, color 0.2s; z-index: 1;
    }
    .modal-close:hover { background: rgba(255,255,255,0.14); color: var(--text-primary); }

    /* Action buttons row */
    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-bottom: 0.85rem;
    }

    .modal-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      font-family: var(--font-family);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-primary);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.5rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      box-sizing: border-box;
      white-space: nowrap;
    }
    .modal-action-btn:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.3); }
    .modal-action-btn.active { border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.07); }
    .modal-action-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .modal-action-btn:disabled:hover {
      background: transparent;
      border-color: rgba(255,255,255,0.16);
    }

    /* Ficha técnica panel */
    .ficha-panel {
      display: none;
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-sm);
      padding: 1rem 1.1rem;
      margin-bottom: 0.85rem;
    }
    .ficha-panel.visible { display: block; }

    .ficha-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      padding: 0.45rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .ficha-val {
      font-family: var(--font-family);
      font-size: 0.8rem;
      color: var(--text-secondary);

    }

    /* Trailer player (replaces poster area) */
    .modal-player {
      position: relative;
      background: #000;
      display: none;
    }
    .modal-player.visible { display: block; }
    .modal-player iframe,
    .modal-player video {
      width: 100%;
      aspect-ratio: 16/9;
      border: none;

    /* Fullscreen video mode — player takes the whole modal */
    .modal.player-fullscreen {
      grid-template-columns: 1fr;
      max-width: 1100px;

      display: none;

    .modal.player-fullscreen .modal-player iframe,
    .modal.player-fullscreen .modal-player video {
      aspect-ratio: unset;
      width: 100%;
      height: 100%;
      min-height: 300px;
    }
    .modal-player-back {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-family);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      padding: 0.7rem 1rem;
      cursor: pointer;
      width: 100%;
      transition: color 0.2s, background 0.2s;
    }
    .modal-player-back:hover { color: var(--text-primary); background: rgba(255,255,255,0.09); }

    /* ── Responsive ── */
    @media (max-width: 580px) {
      .hero-description { display: none; }

  <script>
    /*

        },

      },
      {
        id: 2,
        title: "El Artista Comprendido",

        poster: "/media/cinemateca/posters/el-artista-comprendido.jpg",

      },
      {
        id: 3,

        },

      {

        },
        heroImage: "/media/cinemateca/stills/jaygupta-still1.jpg",
        free: false,
        comingSoon: true,
        featured: false
      },
      {
        id: 5,
        title: "Firefly",
        year: "2026",
        director: "Valdir Neves",
        duration: "Curta-metragem · 7 min",
        genre: "Drama",
        description: "Realização e câmara num filme de uma só divisão, feito em 48 horas para o 48 Hour Film Project.",
        poster: "/media/cinemateca/posters/firefly.png",
        heroImage: "/media/cinemateca/stills/firefly-still1.jpg",
        icon: "✨",
        trailerVideo: null,
        trailerUrl: null,
        tecnica: {
          "Realização": "Valdir Neves",
          "Produção": "Charlie Chaves · Giovanna Domiciano Neto",
          "Argumento": "Rita Primavera Lopes Família · Sinou Gomez",
          "Montagem": "Nikolas Serra",
          "Direção de Fotografia": "Rafaela Sousa",
          "Direção de Arte": "Inês Garcias Lopes · Sofia Aragão",
          "Assistente de Realização": "Sara Silva Veiga",
          "Luz": "Jiani Shi",
          "Operação de Câmara": "Valdir Neves",
          "Fotografia Adicional": "Xihe Yu",
          "Música Original": "André de Brito",
          "Som": "Dylan Cabanis",
          "Elenco": "Marta Taborda (Ophelia) · Leonor Canas (Sophie) · João Guilherme Gouveia · Sinou Gomez",
          "Exibição": "Cinema São Jorge",
          "País": "Portugal"
        },
        free: true,
        embedUrl: "https://youtu.be/MBt4IIQxU8U",
        featured: false
      }
    ];

    /* ════════════════════════════════
       VIDEO HERO
    ════════════════════════════════ */
    const heroEl = document.getElementById('video-hero');
    const heroTitle = document.getElementById('hero-title');
    const heroMeta = document.getElementById('hero-meta');
    const heroDesc = document.getElementById('hero-description');
    const heroRentBtn = document.getElementById('hero-rent-btn');
    const heroInfoBtn = document.getElementById('hero-info-btn');
    const dotsWrap = document.getElementById('hero-dots');
    const progressBar = document.getElementById('hero-progress-bar');

    let currentSlide = 0;
    let autoTimer = null;
    const SLIDE_DURATION = 8000;

    // Build slides
    const slides = films.map((film, i) => {
      const slide = document.createElement('div');
      slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
      slide.dataset.index = i;

      if (film.trailerVideo) {
        const video = document.createElement('video');
        video.className = 'hero-video';
        video.src = film.trailerVideo;
        video.muted = true;
        video.loop = false;
        video.playsInline = true;
        video.preload = 'metadata';
        video.setAttribute('aria-hidden', 'true');
        video.addEventListener('ended', () => goTo((currentSlide + 1) % films.length));
        slide.appendChild(video);
      } else {
        const ph = document.createElement('div');
        ph.className = 'hero-poster-bg';
        if (film.heroImage) {
          const img = document.createElement('img');
          img.className = 'hero-video';
          img.alt = '';
          if (i === 0) { img.src = film.heroImage; }
          else { img.dataset.src = film.heroImage; img.loading = 'lazy'; }
          ph.appendChild(img);
        } else if (film.poster) {
          const img = document.createElement('img');
          img.className = 'hero-video';
          img.alt = '';
          img.style.opacity = '0.55';
          if (i === 0) { img.src = film.poster; }
          else { img.dataset.src = film.poster; img.loading = 'lazy'; }
          ph.appendChild(img);
        } else {
          ph.textContent = film.icon;
        }
        slide.appendChild(ph);
      }

      // Insert before hero-content
      heroEl.insertBefore(slide, document.getElementById('hero-content'));
      return slide;
    });

    // Build dots
    films.forEach((_, i) => {
      const dot = document.createElement('button');
      dot.className = 'hero-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', `Ir para filme ${i + 1}`);
      dot.addEventListener('click', () => goTo(i));
      dotsWrap.appendChild(dot);
    });

    function updateHeroContent(film) {
      heroTitle.textContent = film.title;
      heroMeta.textContent = `${film.year} · ${film.director} · ${film.duration}`;
      heroDesc.textContent = film.description;
      heroRentBtn.innerHTML = '';

      const playIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      playIcon.setAttribute('width', '13'); playIcon.setAttribute('height', '13');
      playIcon.setAttribute('viewBox', '0 0 24 24'); playIcon.setAttribute('fill', 'currentColor');
      playIcon.setAttribute('aria-hidden', 'true');
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      poly.setAttribute('points', '5 3 19 12 5 21 5 3');
      playIcon.appendChild(poly);
      heroRentBtn.appendChild(playIcon);

      if (film.free) {
        heroRentBtn.appendChild(document.createTextNode(' Ver Grátis'));
        heroRentBtn.href = '#';
        heroRentBtn.onclick = function(e) { e.preventDefault(); openModal(film); };
        heroRentBtn.style.opacity = '';
        heroRentBtn.style.pointerEvents = '';
      } else if (film.comingSoon) {
        heroRentBtn.appendChild(document.createTextNode(' Em breve'));
        heroRentBtn.href = '#';
        heroRentBtn.onclick = function(e) { e.preventDefault(); };
        heroRentBtn.style.opacity = '0.4';
        heroRentBtn.style.pointerEvents = 'none';
      } else {
        heroRentBtn.appendChild(document.createTextNode(` Alugar — ${film.rentPrice}`));
        heroRentBtn.href = film.rentStripeUrl;
        heroRentBtn.onclick = null;
        heroRentBtn.style.opacity = '';
        heroRentBtn.style.pointerEvents = '';
      }
    }

    function startProgress() {
      progressBar.style.transition = 'none';
      progressBar.style.width = '0%';
      void progressBar.offsetWidth;
      progressBar.style.transition = `width ${SLIDE_DURATION}ms linear`;
      progressBar.style.width = '100%';
    }

    function goTo(idx) {
      if (idx === currentSlide) return;
      clearTimeout(autoTimer);

      // Pause current video
      const curVideo = slides[currentSlide].querySelector('video');
      if (curVideo) { curVideo.pause(); curVideo.currentTime = 0; }

      slides[currentSlide].classList.remove('active');
      dotsWrap.children[currentSlide].classList.remove('active');

      currentSlide = idx;

      // Hydrate lazy images on first activation
      slides[currentSlide].querySelectorAll('img[data-src]').forEach(function(img) {
        img.src = img.dataset.src;
        delete img.dataset.src;
      });

      slides[currentSlide].classList.add('active');
      dotsWrap.children[currentSlide].classList.add('active');
      updateHeroContent(films[currentSlide]);
      heroInfoBtn.onclick = () => openModal(films[currentSlide]);

      // Play new video if available
      const newVideo = slides[currentSlide].querySelector('video');
      if (newVideo) {
        newVideo.play().catch(() => {});
        newVideo.onended = () => goTo((currentSlide + 1) % films.length);
      } else {
        autoTimer = setTimeout(() => goTo((currentSlide + 1) % films.length), SLIDE_DURATION);
      }

      startProgress();
    }

    // Init
    updateHeroContent(films[0]);
    heroInfoBtn.onclick = () => openModal(films[0]);

    const firstVideo = slides[0].querySelector('video');
    if (firstVideo) {
      firstVideo.play().catch(() => {});
      firstVideo.onended = () => goTo(1 % films.length);
    } else {
      autoTimer = setTimeout(() => goTo(1 % films.length), SLIDE_DURATION);
    }
    startProgress();

    document.getElementById('hero-prev').addEventListener('click', () => {
      goTo((currentSlide - 1 + films.length) % films.length);
    });
    document.getElementById('hero-next').addEventListener('click', () => {
      goTo((currentSlide + 1) % films.length);
    });

    /* ════════════════════════════════
       FILM ROW (carousel)
    ════════════════════════════════ */
    const filmRow = document.getElementById('film-row');
    document.getElementById('row-count').textContent = `${films.length} filmes`;

    films.forEach(film => {
      const card = document.createElement('div');
      card.className = 'film-card' + (film.comingSoon ? ' coming-soon' : '');
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-label', `Ver detalhes de ${film.title}`);

      const posterHTML = film.poster
        ? `<img class="film-poster-img" src="${film.poster}" alt="${film.title}" loading="lazy">`
        : `<div class="film-poster-placeholder">${film.icon}</div>`;

      const badgeHTML = film.free
        ? `<span class="price-badge free">Grátis</span>`
        : film.comingSoon
          ? `<span class="price-badge soon">Em breve</span>`
          : `<span class="price-badge">${film.rentPrice}</span>`;

      const hoverLabel = film.free
        ? 'Ver agora'
        : film.comingSoon
          ? 'Em breve'
          : 'Ver opções';

      card.innerHTML = `
        <div class="film-card-inner">
          <div class="film-poster-wrap">
            ${posterHTML}
            <div class="film-hover-panel">
              <button class="hover-rent-btn">${hoverLabel}</button>
            </div>
          </div>
          <div class="film-card-info">
            <h3 class="film-card-title">${film.title}</h3>
            <p class="film-card-meta">${film.year} · ${film.director}</p>
            ${badgeHTML}
          </div>
        </div>
      `;

      card.addEventListener('click', () => openModal(film));
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') openModal(film);
      });
      filmRow.appendChild(card);
    });

    // Scroll buttons
    const scrollLeft = document.getElementById('scroll-left');
    const scrollRight = document.getElementById('scroll-right');
    const SCROLL_AMOUNT = 480;

    scrollLeft.addEventListener('click', () => {
      filmRow.scrollBy({ left: -SCROLL_AMOUNT, behavior: 'smooth' });
    });
    scrollRight.addEventListener('click', () => {
      filmRow.scrollBy({ left: SCROLL_AMOUNT, behavior: 'smooth' });
    });

    function updateScrollBtns() {
      scrollLeft.disabled = filmRow.scrollLeft <= 10;
      scrollRight.disabled = filmRow.scrollLeft >= filmRow.scrollWidth - filmRow.clientWidth - 10;
    }
    filmRow.addEventListener('scroll', updateScrollBtns);
    updateScrollBtns();

    /* ════════════════════════════════
       MODAL
    ════════════════════════════════ */
    const backdrop = document.getElementById('modal-backdrop');
    const modal    = document.getElementById('modal');
    const modalClose = document.getElementById('modal-close');

    const fichaBtn = document.getElementById('modal-ficha-btn');
    const fichaPanel = document.getElementById('modal-ficha-panel');
    const trailerPlayer = document.getElementById('modal-player');
    const trailerPlayerContent = document.getElementById('modal-player-content');
    const trailerPlayerBack = document.getElementById('modal-player-back');
    const posterWrap = document.getElementById('modal-poster-wrap');

    function buildEmbedUrl(url) {
      if (!url) return null;
      // YouTube
      const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
      if (ytMatch) return `https://www.youtube-nocookie.com/embed/${ytMatch[1]}?autoplay=1&rel=0`;
      // Vimeo
      const viMatch = url.match(/vimeo\.com\/(\d+)/);
      if (viMatch) return `https://player.vimeo.com/video/${viMatch[1]}?autoplay=1`;
      // Local/direct video file
      if (url.match(/\.(mp4|webm|ogg)$/i)) return null; // handled separately
      return null;
    }

    function showTrailer(film) {
      posterWrap.style.display = 'none';
      trailerPlayer.classList.add('visible');
      modal.classList.add('player-fullscreen');

      const embedUrl = buildEmbedUrl(film.trailerUrl);
      if (embedUrl) {
        trailerPlayerContent.innerHTML =
          `<iframe src="${embedUrl}" allow="autoplay; fullscreen" allowfullscreen title="${film.title}"></iframe>`;
      } else if (film.trailerUrl) {
        trailerPlayerContent.innerHTML =
          `<video src="${film.trailerUrl}" controls autoplay playsinline></video>`;
      }
    }

    function hideTrailer() {
      trailerPlayer.classList.remove('visible');
      modal.classList.remove('player-fullscreen');
      trailerPlayerContent.innerHTML = '';
      posterWrap.style.display = '';
    }

    function toggleFicha(film) {
      const isOpen = fichaPanel.classList.contains('visible');
      if (isOpen) {
        fichaPanel.classList.remove('visible');
        fichaBtn.classList.remove('active');
      } else {
        const rows = Object.entries(film.tecnica || {}).map(([k, v]) =>
          `<div class="ficha-row"><span class="ficha-key">${k}</span><span class="ficha-val">${v}</span></div>`
        ).join('');
        fichaPanel.innerHTML = rows;
        fichaPanel.classList.add('visible');
        fichaBtn.classList.add('active');
      }
    }

    function openModal(film) {
      // Reset state
      hideTrailer();
      fichaPanel.classList.remove('visible');
      fichaBtn.classList.remove('active');

      document.getElementById('modal-title').textContent = film.title;
      document.getElementById('modal-meta').textContent =
        `${film.year} · ${film.director} · ${film.duration} · ${film.genre}`;
      document.getElementById('modal-desc').textContent = film.description;

      if (film.heroImage) {
        posterWrap.innerHTML = `<img class="modal-poster" src="${film.heroImage}" alt="${film.title}">`;
      } else if (film.poster) {
        posterWrap.innerHTML = `<img class="modal-poster" src="${film.poster}" alt="${film.title}">`;
      } else {
        posterWrap.innerHTML = `<div class="modal-poster-placeholder">${film.icon}</div>`;
      }

      fichaBtn.onclick = () => toggleFicha(film);

      // Purchase / watch section
      const purchaseSection = document.querySelector('.purchase-options');
      const modalNote = document.querySelector('.modal-note');
      let watchSection = document.getElementById('modal-watch-section');

      if (!watchSection) {
        watchSection = document.createElement('div');
        watchSection.id = 'modal-watch-section';
        purchaseSection.parentNode.insertBefore(watchSection, purchaseSection);
      }

      if (film.free) {
        // Free film: show watch button, hide purchase options
        purchaseSection.style.display = 'none';
        modalNote.style.display = 'none';
        watchSection.style.display = 'block';

        const hasEmbed = !!film.embedUrl;
        watchSection.innerHTML = `
          <button class="watch-now-btn${hasEmbed ? '' : ' soon'}" id="modal-watch-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            ${hasEmbed ? 'Ver Agora — Grátis' : 'Em breve'}
          </button>
          ${hasEmbed ? '<p style="font-family:var(--font-family);font-size:0.72rem;color:var(--text-muted);text-align:center;">Visualização gratuita · Sem necessidade de registo</p>' : ''}
        `;

        if (hasEmbed) {
          document.getElementById('modal-watch-btn').addEventListener('click', () => {
            showTrailer({ trailerUrl: film.embedUrl, title: film.title });
          });
        }
      } else if (film.comingSoon) {
        watchSection.style.display = 'none';
        modalNote.style.display = '';
        modalNote.textContent = 'Brevemente disponível para alugar e comprar.';

        if (film.rentPrice || film.buyPrice) {
          purchaseSection.style.display = '';
          document.getElementById('modal-rent-price').textContent = film.rentPrice || '—';
          document.getElementById('modal-buy-price').textContent = film.buyPrice || '—';

          const rentBtn = document.getElementById('modal-rent-btn');
          rentBtn.textContent = 'Em breve';
          rentBtn.removeAttribute('href');
          rentBtn.style.opacity = '0.4';
          rentBtn.style.pointerEvents = 'none';

          const buyBtn = document.getElementById('modal-buy-btn');
          buyBtn.textContent = 'Em breve';
          buyBtn.removeAttribute('href');
          buyBtn.style.opacity = '0.4';
          buyBtn.style.pointerEvents = 'none';
        } else {
          purchaseSection.style.display = 'none';
        }
      } else {
        // Normal paid film
        watchSection.style.display = 'none';
        purchaseSection.style.display = '';
        modalNote.style.display = '';
        modalNote.textContent = 'Pagamento seguro via Stripe. Após a compra recebes o link do filme por email.';

        document.getElementById('modal-rent-price').textContent = film.rentPrice;
        document.getElementById('modal-buy-price').textContent = film.buyPrice;

        const rentBtn = document.getElementById('modal-rent-btn');
        rentBtn.textContent = 'Alugar agora';
        rentBtn.href = film.rentStripeUrl;
        rentBtn.style.opacity = '';
        rentBtn.style.pointerEvents = '';

        const buyBtn = document.getElementById('modal-buy-btn');
        buyBtn.textContent = 'Comprar';
        buyBtn.href = film.buyStripeUrl;
        buyBtn.style.opacity = '';
        buyBtn.style.pointerEvents = '';
      }

      backdrop.classList.add('open');
      document.body.style.overflow = 'hidden';
      modalClose.focus();
    }

    trailerPlayerBack.addEventListener('click', hideTrailer);

    function closeModal() {
      backdrop.classList.remove('open');
      document.body.style.overflow = '';
      hideTrailer();
      fichaPanel.classList.remove('visible');
      fichaBtn.classList.remove('active');
    }

    modalClose.addEventListener('click', closeModal);
    backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  </script>

  <script src="/shared.js"></script>
</body>
</html>
