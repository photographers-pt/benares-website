<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>.KO Lisboa | Club Benares</title>
  <meta name="description" content="Lisbon International Short-film Championship: o campeonato de curtas-metragens do Club Benares. Em breve." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Club Benares" />
  <meta property="og:locale" content="pt_PT" />
  <meta property="og:title" content=".KO Lisboa | Club Benares" />
  <meta property="og:description" content="Lisbon International Short-film Championship: o campeonato de curtas-metragens do Club Benares. Em breve." />
  <meta property="og:image" content="https://thebenaresclub.com/Imagenes/01%20Banners/KO%20-%20LISC.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    :root {
      --bg-base:        #a60000;
      --bg-surface:     #b20000;
      --bg-elevated:    #be0000;
      --text-primary:   #ffffff;
      --text-secondary: rgba(255,255,255,0.75);
      --text-muted:     rgba(255,255,255,0.5);
      --border:         rgba(255,255,255,0.15);
      --border-strong:  rgba(255,255,255,0.35);
      --red:            #C8101F;
      --red-bright:     #FF1830;
    }

    body {
      background-color: var(--bg-base);
    }

    header, nav {
      background: rgba(120, 0, 0, 0.92) !important;
      border-color: rgba(255,255,255,0.12) !important;
    }

    footer {
      background-color: rgba(100, 0, 0, 0.95) !important;
      border-top-color: rgba(255,255,255,0.12) !important;
    }

    .ko-page {
      min-height: 85vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6rem 2rem 8rem;
      position: relative;
      overflow: hidden;
      background-image: url('/Imagenes/01%20Banners/KO%20-%20LISC.png');
      background-size: cover;
      background-position: center;
    }

    .ko-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(100, 0, 0, 0.72);
      pointer-events: none;
    }

    .ko-eyebrow {
      font-family: var(--font-family);
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 1.5rem;
      position: relative;
    }

    .ko-title {
      font-family: var(--font-family);
      font-size: clamp(3.5rem, 16vw, 11rem);
      font-weight: 700;
      color: #ffffff;
      line-height: 0.9;
      letter-spacing: -0.03em;
      margin: 0 0 1.25rem;
      position: relative;
      text-shadow: 0 4px 40px rgba(0,0,0,0.25);
    }

    .ko-subtitle {
      font-family: var(--font-family);
      font-size: clamp(0.65rem, 1.4vw, 0.88rem);
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin: 0 0 4rem;
      position: relative;
    }

    .ko-coming-soon {
      font-family: var(--font-family);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      position: relative;
    }

  </style>
  <script src="/i18n-dict.js"></script>
  <script src="/i18n.js"></script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <div id="grain"></div>
  <div id="header-container"></div>

  <main>
    <div class="ko-page">
      <span class="ko-eyebrow">The Benares Club presents</span>
      <h1 class="ko-title">.KO</h1>
      <p class="ko-subtitle">Lisbon International Short-film Championship</p>
      <span class="ko-coming-soon">Coming Soon</span>
    </div>
  </main>

  <div id="footer-container"></div>
  <script src="/shared.js"></script>
</body>
</html>
