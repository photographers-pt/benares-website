<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fototeca | Club Benares</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    main { /* no max-width — banner full width */ }

    /* ── Event section ── */
    .event-section {
      padding: 4rem 0 0;
      border-top: 1px solid var(--border);
    }

    .event-section:first-of-type {
      border-top: none;
      padding-top: 2.5rem;
    }

    .event-header {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 2rem 1.75rem;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.6rem 1.5rem;
    }

    .event-eyebrow {
      font-family: var(--font-family);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .event-title {
      font-family: var(--font-family);
      font-size: clamp(1.2rem, 2.2vw, 1.7rem);
      font-weight: 300;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-primary);
      margin: 0;
    }

    .event-date {
      font-family: var(--font-family);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .event-cinemateca {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: var(--font-family);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-secondary);
      text-decoration: none;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0.4rem 0.9rem;
      transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .event-cinemateca:hover {
      color: var(--text-primary);
      border-color: var(--text-primary);
    }

    /* ── Photo grid ── */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 240px;
      gap: 2px;
      margin-bottom: 2px;
    }

    .photo-item {
      position: relative;
      overflow: hidden;
      background: rgba(255, 248, 238, 0.03);
      cursor: pointer;
    }

    .photo-item.tall  { grid-row: span 2; }
    .photo-item.wide  { grid-column: span 2; }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease, opacity 0.3s ease, filter 0.5s ease;
      opacity: 0.88;
      filter: grayscale(100%);
    }

    .photo-item:hover img {
      transform: scale(1.04);
      opacity: 1;
      filter: grayscale(40%);
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 900;
      background: rgba(8, 7, 6, 0.97);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-img-wrap {
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0.97);
      transition: transform 0.3s ease;
    }

    .lightbox.open .lightbox-img-wrap {
      transform: scale(1);
    }

    .lightbox-img-wrap img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
      filter: grayscale(100%);
      animation: colorReveal 0.7s ease forwards;
    }

    @keyframes colorReveal {
      from { filter: grayscale(100%); }
      to   { filter: grayscale(0%); }
    }

    .lightbox-close {
      position: fixed;
      top: 1.5rem;
      right: 1.75rem;
      background: transparent;
      border: none;
      color: rgba(240, 232, 216, 0.35);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s;
      z-index: 1;
    }
    .lightbox-close:hover { color: var(--text-primary); }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: rgba(240, 232, 216, 0.25);
      font-size: 2rem;
      cursor: pointer;
      padding: 1rem;
      line-height: 1;
      transition: color 0.2s;
    }
    .lightbox-nav:hover { color: var(--text-primary); }
    .lightbox-prev { left: 0.5rem; }
    .lightbox-next { right: 0.5rem; }

    .lightbox-caption {
      position: fixed;
      bottom: 1.75rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-family);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
      pointer-events: none;
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .photo-grid {
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: 200px;
      }
    }

    @media (max-width: 600px) {
      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
        grid-auto-rows: 160px;
      }
      .photo-item.wide { grid-column: span 1; }
      .event-cinemateca { margin-left: 0; }
      .lightbox-nav { display: none; }
    }
  </style>
  <script src="/i18n-dict.js"></script>
  <script src="/i18n.js"></script>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

  <div id="grain"></div>
  <div id="header-container"></div>

  <main>
    <div class="page-banner">
      <img src="/media/banners/fototeca.png" alt="" class="page-banner-img">
      <div class="page-banner-title">
        <span class="page-banner-eyebrow">The Benares Club</span>
        <h1 class="page-banner-heading">Fototeca</h1>
      </div>
    </div>

    <div id="gallery-root"></div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lbClose" aria-label="Fechar">&#x2715;</button>
    <button class="lightbox-nav lightbox-prev" id="lbPrev" aria-label="Anterior">&#8592;</button>
    <div class="lightbox-img-wrap" id="lbImgWrap"></div>
    <button class="lightbox-nav lightbox-next" id="lbNext" aria-label="Seguinte">&#8594;</button>
    <div class="lightbox-caption" id="lbCaption"></div>
  </div>

  <div id="footer-container"></div>

  <script>
    /*
     * FOTOTECA — catálogo de eventos
     *
     * Para adicionar um evento:
     *   prefix   → prefixo dos ficheiros em /media/fototeca/ (ex: "nl1")
     *   ext      → extensão dos ficheiros ("jpg" ou "png")
     *   count    → número total de fotos
     *   title    → nome do evento
     *   date     → data do evento (texto livre)
     *   filme    → true se for registo de um filme (mostra link para cinemateca)
     *
     * Ordem neste ficheiro: cronológica (mais antigo primeiro), por isso um evento novo
     * acrescenta-se no FIM da lista. Na página aparecem ao contrário: o mais recente em cima.
     */
    const events = [
      {
        prefix: 'inx',
        ext: 'jpg',
        count: 22,
        title: 'Inexistente',
        date: 'Abr 2023',
        filme: true
      },
      {
        prefix: 'eac',
        ext: 'jpg',
        count: 30,
        title: 'El Artista Comprendido',
        date: 'Abr 2024',
        filme: true
      },
      {
        prefix: 'nl1',
        ext: 'jpg',
        count: 13,
        title: 'Night Lounge #1',
        date: '11 Dez 2024',
        filme: false
      },
      {
        prefix: 'nl2',
        ext: 'jpg',
        count: 9,
        title: 'Night Lounge #2',
        date: '20 Jan 2025',
        filme: false
      },
      {
        prefix: 'nl3',
        ext: 'jpg',
        count: 15,
        title: 'Night Lounge #3',
        date: '19 Abr 2025',
        filme: false
      },
      {
        prefix: 'jg',
        ext: 'jpg',
        count: 21,
        title: 'Jay Gupta',
        date: 'Jun 2025',
        filme: true
      },
      {
        prefix: 'mu1',
        ext: 'jpg',
        count: 14,
        title: 'MashUp #1',
        date: '16 Out 2025',
        filme: false,
        mixedExts: { 11: 'png' }
      },
      {
        prefix: 'mu2',
        ext: 'jpg',
        count: 24,
        title: 'MashUp #2',
        date: '27 Nov 2025',
        filme: false
      },
      {
        prefix: 'mu3',
        ext: 'png',
        count: 8,
        title: 'MashUp #3',
        date: '05 Dez 2025',
        filme: false
      },
      {
        prefix: 'mu4',
        ext: 'png',
        count: 13,
        title: 'MashUp #4',
        date: '16 Mar 2026',
        filme: false
      },
      {
        prefix: 'mu5',
        ext: 'png',
        count: 9,
        title: 'MashUp #5',
        date: '07 Mai 2026',
        filme: false
      }
    ];

    /* Span pattern for 4-col mosaic — cycles every 10 */
    var SPAN_PATTERN = ['wide', '', 'tall', '', '', '', '', 'wide', 'tall', ''];

    function getSpan(i) {
      return SPAN_PATTERN[i % SPAN_PATTERN.length];
    }

    /* Build all photos into a flat list for lightbox navigation */
    var allPhotos = [];

    var root = document.getElementById('gallery-root');

    /* Mais recente primeiro; o número (01, 02…) continua a ser o do evento por ordem cronológica */
    events.slice().reverse().forEach(function(ev) {
      var evIdx = events.indexOf(ev);
      var section = document.createElement('div');
      section.className = 'event-section';

      /* Header */
      var header = document.createElement('div');
      header.className = 'event-header';

      var eyebrow = document.createElement('span');
      eyebrow.className = 'event-eyebrow';
      eyebrow.textContent = String(evIdx + 1).padStart(2, '0');

      var title = document.createElement('h2');
      title.className = 'event-title';
      title.textContent = ev.title;

      var date = document.createElement('span');
      date.className = 'event-date';
      date.textContent = ev.date;

      header.appendChild(eyebrow);
      header.appendChild(title);
      header.appendChild(date);

      if (ev.filme) {
        var cineLink = document.createElement('a');
        cineLink.className = 'event-cinemateca';
        cineLink.href = '/cinemateca/';
        cineLink.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg> Ver na Cinemateca';
        header.appendChild(cineLink);
      }

      section.appendChild(header);

      /* Grid */
      var grid = document.createElement('div');
      grid.className = 'photo-grid';

      for (var i = 1; i <= ev.count; i++) {
        var n = String(i).padStart(2, '0');
        var thumbSrc = '/media/fototeca/thumb/' + ev.prefix + '-' + n + '.jpg';
        var fullSrc  = '/media/fototeca/full/'  + ev.prefix + '-' + n + '.jpg';
        var caption = ev.title + ' · ' + ev.date;
        var photoIndex = allPhotos.length;

        allPhotos.push({ src: fullSrc, caption: caption });

        var item = document.createElement('div');
        item.className = 'photo-item' + (getSpan(i - 1) ? ' ' + getSpan(i - 1) : '');
        item.dataset.idx = photoIndex;

        var img = document.createElement('img');
        img.src = thumbSrc;
        img.alt = caption;
        img.loading = 'lazy';

        item.appendChild(img);
        item.addEventListener('click', (function(idx) {
          return function() { openLightbox(idx); };
        })(photoIndex));

        grid.appendChild(item);
      }

      section.appendChild(grid);
      root.appendChild(section);
    });

    /* Lightbox */
    var lb      = document.getElementById('lightbox');
    var lbWrap  = document.getElementById('lbImgWrap');
    var lbCap   = document.getElementById('lbCaption');
    var lbClose = document.getElementById('lbClose');
    var lbPrev  = document.getElementById('lbPrev');
    var lbNext  = document.getElementById('lbNext');
    var curIdx  = 0;

    function showPhoto(i) {
      curIdx = i;
      var p = allPhotos[i];
      lbWrap.innerHTML = '';
      var img = new Image();
      img.src = p.src;
      lbWrap.appendChild(img);
      lbCap.textContent = p.caption;
      lbPrev.style.opacity = i === 0 ? '0.12' : '0.28';
      lbNext.style.opacity = i === allPhotos.length - 1 ? '0.12' : '0.28';
    }

    function openLightbox(i) {
      showPhoto(i);
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lb.classList.remove('open');
      document.body.style.overflow = '';
    }

    lbClose.addEventListener('click', closeLightbox);
    lb.addEventListener('click', function(e) { if (e.target === lb) closeLightbox(); });
    lbPrev.addEventListener('click', function(e) {
      e.stopPropagation();
      if (curIdx > 0) showPhoto(curIdx - 1);
    });
    lbNext.addEventListener('click', function(e) {
      e.stopPropagation();
      if (curIdx < allPhotos.length - 1) showPhoto(curIdx + 1);
    });
    document.addEventListener('keydown', function(e) {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft'  && curIdx > 0) showPhoto(curIdx - 1);
      if (e.key === 'ArrowRight' && curIdx < allPhotos.length - 1) showPhoto(curIdx + 1);
    });
  </script>

  <script src="/shared.js"></script>
</body>
</html>
